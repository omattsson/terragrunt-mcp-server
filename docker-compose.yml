version: '3.8'

services:
  terragrunt-mcp:
    # Use pre-built image from Docker Hub (recommended)
    image: olofdevopsninja/terragrunt-mcp-server:latest
    
    # OR build locally (uncomment to override).
    # To build locally, uncomment the build section below AND comment out/remove the image line above.
    # The build section will generate the 'terragrunt-mcp-server:latest' image automatically.
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    
    container_name: terragrunt-mcp-server
    stdin_open: true
    tty: true
    volumes:
      # Mount cache directory to persist documentation cache
      - mcp-cache:/app/.cache
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    # For stdio-based MCP, we rely on docker exec or stdin/stdout
    # If you need HTTP/SSE transport, uncomment:
    # ports:
    #   - "3000:3000"

volumes:
  mcp-cache:
    driver: local
