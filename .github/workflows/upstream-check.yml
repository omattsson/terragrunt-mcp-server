name: Upstream Revision Check

on:
  schedule:
    # Run weekly on Monday at 03:00 UTC (schema drift check runs Sunday)
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-upstream-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check upstream revision drift
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          npm run check-upstream-drift --silent > upstream-report.json 2> upstream-log.txt
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -ne 0 ] && [ ! -s upstream-report.json ]; then
            echo "drift=error" >> $GITHUB_OUTPUT
            echo "Error: upstream drift check failed"
            cat upstream-log.txt
            exit 0
          fi

          if [ -s upstream-report.json ]; then
            DRIFT=$(jq -r '.hasDrift' upstream-report.json)
            echo "drift=$DRIFT" >> $GITHUB_OUTPUT
          else
            echo "drift=error" >> $GITHUB_OUTPUT
            echo "Error: upstream-report.json not generated"
            cat upstream-log.txt
          fi

      - name: Upload drift report as artifact
        if: steps.check.outputs.drift == 'true' || steps.check.outputs.drift == 'error'
        uses: actions/upload-artifact@v7
        with:
          name: upstream-drift-report
          path: |
            upstream-report.json
            upstream-log.txt
          retention-days: 30

      - name: Create or update upstream drift issue
        if: steps.check.outputs.drift == 'true' || steps.check.outputs.drift == 'error'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const isError = '${{ steps.check.outputs.drift }}' === 'error';

            let body;
            if (isError) {
              body = '## Upstream Revision Check Failed\n\n';
              body += `**Generated:** ${new Date().toISOString()}\n\n`;
              body += '⚠️ The upstream drift check script encountered an error and could not complete.\n\n';
              body += 'Possible causes:\n';
              body += '- GitHub API rate limiting or connectivity issues\n';
              body += '- The pinned revision or a watched path no longer resolves\n\n';
              body += `Check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) logs and artifact.\n`;
            } else {
              const report = JSON.parse(fs.readFileSync('upstream-report.json', 'utf8'));
              body = '## Upstream Revision Drift Detected\n\n';
              body += `**Generated:** ${report.timestamp}\n\n`;
              body += `The curated data is pinned to \`${report.pinnedRevision}\`. `;
              body += `Upstream is at \`${report.upstreamHead}\` (${report.aheadBy} commits ahead), and `;
              body += `${report.changed.length} watched path(s) changed since the pin:\n\n`;
              body += '| Path | Why it matters | Latest change |\n';
              body += '| --- | --- | --- |\n';
              for (const item of report.changed) {
                const commit = item.latestCommit
                  ? `[\`${item.latestCommit.sha.substring(0, 7)}\`](${item.latestCommit.url}) ${item.latestCommit.date.substring(0, 10)}`
                  : 'path not found upstream (removed or renamed?)';
                body += `| \`${item.path}\` | ${item.reason} | ${commit} |\n`;
              }
              body += '\n## Next Steps\n\n';
              body += '1. Follow the refresh procedure in `docs/upstream-parity.md`.\n';
              body += '2. Update `UPSTREAM_REVISION` in `src/terragrunt/docs-manifest.ts` to the new revision.\n';
              body += '3. Reconcile fixtures, curated data, and diagnosis pattern anchors; the parity tests fail on real drift.\n';
              body += '4. This issue closes automatically once no watched path has drifted.\n\n';
              body += '> [!NOTE]\n';
              body += '> This issue was automatically generated by the Upstream Revision Check workflow.\n';
            }

            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-drift'
            });

            if (existingIssues.data.length > 0) {
              const issue = existingIssues.data[0];
              core.info(`Updating existing issue #${issue.number}`);
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: body
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `🔄 Upstream revision check updated on ${new Date().toISOString()}`
              });
            } else {
              const title = isError
                ? '❌ Upstream Revision Check Failed - Investigation Required'
                : '⚠️ Upstream Revision Drift - Pinned Terragrunt Data Needs Refresh';
              const labels = isError
                ? ['upstream-drift', 'bug', 'investigation']
                : ['upstream-drift', 'enhancement', 'documentation'];
              const newIssue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: labels
              });
              core.info(`Created issue #${newIssue.data.number}`);
            }

      - name: Report success
        if: steps.check.outputs.drift == 'false'
        run: |
          echo "✅ No watched upstream paths changed since the pinned revision."

      - name: Close stale upstream drift issues
        if: steps.check.outputs.drift == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            // Drift has cleared; close any open auto-generated drift issues.
            // Paginate so more than one page of open issues is handled.
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-drift',
              per_page: 100
            });

            for (const issue of issues) {
              core.info(`Closing resolved upstream-drift issue #${issue.number}`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Upstream revision check reported no drift on ${new Date().toISOString()}. Closing automatically.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }
