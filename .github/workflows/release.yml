name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.3.1)'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
      action:
        description: 'Action to perform'
        required: true
        type: choice
        default: 'create-pr'
        options:
          - create-pr
          - publish-release

jobs:
  create-version-pr:
    name: Create Version Bump PR
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'create-pr'
    permissions:
      contents: write
      pull-requests: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: |
          npm run build
          npm run lint
          npm run test:server
      
      - name: Create release branch and PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create a release branch
          BRANCH_NAME="release/v${{ github.event.inputs.version }}"
          git checkout -b $BRANCH_NAME
          
          # Update version
          npm version ${{ github.event.inputs.version }} --no-git-tag-version
          
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Commit changes
          git add package.json package-lock.json
          git commit -m "chore: Bump version to ${{ github.event.inputs.version }}"
          
          # Push branch
          git push origin $BRANCH_NAME
          
          # Create PR body file
          cat > /tmp/pr-body.md << 'EOF'
          ## Release v${{ github.event.inputs.version }}

          This PR bumps the version to ${{ github.event.inputs.version }}.

          ### Next Steps
          1. Review and merge this PR
          2. After merge, run the **Create Release** workflow again
          3. Select action: **publish-release**
          4. Enter the same version: **${{ github.event.inputs.version }}**

          This will create the git tag and GitHub release.
          EOF
          
          # Create PR
          gh pr create \
            --title "Release v${{ github.event.inputs.version }}" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head $BRANCH_NAME
          
          echo "✅ Release PR created successfully!"

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'publish-release'
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'
      
      - name: Verify version in package.json
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if [ "$CURRENT_VERSION" != "${{ github.event.inputs.version }}" ]; then
            echo "❌ Error: package.json version ($CURRENT_VERSION) doesn't match input version (${{ github.event.inputs.version }})"
            echo "Make sure the version bump PR is merged first!"
            exit 1
          fi
          echo "✅ Version verified: $CURRENT_VERSION"
      
      - name: Build Docker image
        run: |
          docker build -t terragrunt-mcp-server:${{ github.event.inputs.version }} .
          docker tag terragrunt-mcp-server:${{ github.event.inputs.version }} terragrunt-mcp-server:latest
      
      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            echo "First release - generating full changelog"
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges --grep='^chore: Bump version' --invert-grep)
          else
            echo "Generating changelog since $PREV_TAG"
            CHANGELOG=$(git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges --grep='^chore: Bump version' --invert-grep)
          fi
          
          # Write to file to handle multiline
          echo "$CHANGELOG" > /tmp/changelog.txt
          
          # Set output
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/changelog.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a v${{ github.event.inputs.version }} -m "Release v${{ github.event.inputs.version }}"
          git push origin v${{ github.event.inputs.version }}
      
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if a changelog file exists
          if [ -f "CHANGELOG-${{ github.event.inputs.version }}.md" ]; then
            echo "📝 Using existing changelog file"
            gh release create v${{ github.event.inputs.version }} \
              --title "v${{ github.event.inputs.version }}" \
              --notes-file "CHANGELOG-${{ github.event.inputs.version }}.md" \
              ${{ github.event.inputs.prerelease == 'true' && '--prerelease' || '--latest' }}
          else
            echo "📝 Generating changelog from git history"
            PREV_TAG=$(git describe --tags --abbrev=0 v${{ github.event.inputs.version }}^ 2>/dev/null || echo "")
            
            if [ -z "$PREV_TAG" ]; then
              CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges --grep='^chore: Bump version' --invert-grep)
            else
              CHANGELOG=$(git log $PREV_TAG..v${{ github.event.inputs.version }} --pretty=format:"- %s (%h)" --no-merges --grep='^chore: Bump version' --invert-grep)
            fi
            
            # Create release notes
            cat > /tmp/release-notes.md << EOF
          ## What's New in v${{ github.event.inputs.version }}
          
          ### Changes
          $CHANGELOG
          
          ### Installation
          
          \`\`\`bash
          npm install
          npm run build
          \`\`\`
          
          ### Docker
          
          \`\`\`bash
          docker build -t terragrunt-mcp-server:${{ github.event.inputs.version }} .
          docker run -i terragrunt-mcp-server:${{ github.event.inputs.version }}
          \`\`\`
          
          ### VS Code Configuration
          
          \`\`\`json
          {
            "mcp.servers": {
              "terragrunt": {
                "command": "node",
                "args": ["/path/to/terragrunt-mcp-server/dist/index.js"]
              }
            }
          }
          \`\`\`
          EOF
            
            gh release create v${{ github.event.inputs.version }} \
              --title "v${{ github.event.inputs.version }}" \
              --notes-file /tmp/release-notes.md \
              ${{ github.event.inputs.prerelease == 'true' && '--prerelease' || '--latest' }}
          fi
          
          echo "✅ Release v${{ github.event.inputs.version }} published successfully!"
