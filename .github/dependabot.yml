version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # typescript-eslint caps its typescript peer at <6.1.0 and TypeScript 7 has
      # no stable JS API yet. Remove this once a typescript-eslint release
      # supports TypeScript 7 (https://github.com/typescript-eslint/typescript-eslint/issues/10940).
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      # Security fixes for transitive packages land as a single lockfile PR
      security:
        applies-to: security-updates
        patterns:
          - "*"
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
